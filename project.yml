name: Drawer
options:
  bundleIdPrefix: co.pressware
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: V9DL4KN44P
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Drawer:
    type: application
    platform: macOS
    sources:
      - path: Drawer
        excludes:
          - Info.plist
          - Drawer.entitlements
      - path: Drawer/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Drawer
        PRODUCT_MODULE_NAME: Drawer
        PRODUCT_BUNDLE_IDENTIFIER: co.pressware.drawer
        INFOPLIST_FILE: Drawer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Drawer/Drawer.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: $(ARCHS_STANDARD)
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          # Don't add the debugging entitlement (get-task-allow) to Release builds.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  DrawerTests:
    type: bundle.unit-test
    platform: macOS
    # Standalone (non-hosted): pure-logic sources are compiled directly into the test bundle.
    sources:
      - path: DrawerTests
      - path: Drawer/DrawerState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.pressware.drawer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        CODE_SIGN_STYLE: Automatic

schemes:
  Drawer:
    build:
      targets:
        Drawer: all
        DrawerTests: [test]
    test:
      targets:
        - DrawerTests
    run:
      config: Debug
    archive:
      config: Release
